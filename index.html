<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica de la página -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página web</title>

  <!-- Conectamos el archivo de estilos CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado principal de la página -->
  <header>
    <h1>Mi primera página web</h1>
  </header>

  <!-- Sección de presentación -->
  <section class="presentacion">
    <h2>¡Hola! Soy Michael Murillo</h2>
    <p>
      Estudiante de desarrollo web apasionado por la tecnología.
      Esta es mi primera página web creada con HTML, CSS y JavaScript.
    </p>

    <!-- Botón que muestra un mensaje de bienvenida -->
    <button id="btnBienvenida">Conocer más</button>

    <!-- Aquí aparecerá el mensaje de bienvenida -->
    <p id="mensajeBienvenida"></p>
  </section>

  <!-- Sección de habilidades -->
  <section class="habilidades">
    <h2>Mis habilidades</h2>
    <ul>
      <li>Soporte técnico</li>
      <li>Redes</li>
      <li>Bases de datos</li>
      <li>Python</li>
      <li>Desarrollo web</li>
    </ul>
  </section>

  <!-- Pie de página -->
  <footer>
    <p>© 2026 Michael Murillo</p>
  </footer>

  <!-- Conectamos el archivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
